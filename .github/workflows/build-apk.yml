
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: JRR_MUSICS_ANDROID_SEM_LOGIN

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Criar estrutura Android
        run: flutter create --platforms=android --org com.jrrmusics --project-name jrr_musics .

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: JRR-MUSICS-APK
          path: JRR_MUSICS_ANDROID_SEM_LOGIN/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
